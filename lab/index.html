<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab — Colin Willow</title>
<meta name="robots" content="noindex">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0c; --ink: #ecebe6; --muted: #86847e; --accent: #b07a8f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 400 14px/1.4 'Inter Tight', system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; pointer-events: none; display: flex; justify-content: space-between; align-items: center;
    padding: 0 max(16px, env(safe-area-inset-left)); }
  .top { top: calc(12px + env(safe-area-inset-top)); }
  .bot { bottom: calc(18px + env(safe-area-inset-bottom)); flex-direction: column; gap: 12px; }
  .mark { font: 700 13px var(--ui, inherit); letter-spacing: .22em; text-decoration: none; color: var(--ink); pointer-events: auto; }
  .mark b { font-weight: 400; color: var(--muted); margin-left: .35em; }
  .top a.plain { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    text-decoration: none; pointer-events: auto; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #444; transition: background .3s, transform .3s; }
  .dots i.on { background: var(--accent); transform: scale(1.4); }
  .hint { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); transition: opacity .4s; }
  .sub { font-size: 14px; color: var(--muted); max-width: 32ch; text-align: center; min-height: 2.8em; transition: opacity .3s; }
  .tools { display: flex; gap: 8px; pointer-events: auto; }
  .tools button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #2c2c2e; background: #151516; color: var(--ink); cursor: pointer; }
  .tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud top">
    <a class="mark" href="../">COLIN<b>WILLOW</b></a>
    <div class="tools">
      <button id="sound" aria-label="Music (the swarm reacts)">♪</button>
      <a class="plain" href="../" style="align-self:center">Index</a>
    </div>
  </div>
  <div class="hud bot">
    <div class="sub" id="sub"></div>
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">swipe · tap to enter</div>
  </div>
  <script type="module" src="lab.js?v=304fc281"></script>
</body>
</html>
