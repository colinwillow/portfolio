<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colin Willow</title>
<meta name="description" content="Colin Willow — games, rigged characters, scripts, motion and strange little worlds.">
<script>
  // One page serves every URL (colinwillow.com/play/shredworld, ...). The base
  // is the repo subpath on github.io and the root on a custom domain; writing
  // it into <base> keeps every relative asset right however deep the URL is.
  // Served from /portfolio/ (colinwillow.github.io/portfolio or colinwillow.com/portfolio)
  // or from a domain's root. Decide by the path, never the host.
  window.BASE = location.pathname.split('/')[1] === 'portfolio' ? '/portfolio/' : '/';
  document.write('<base href="' + window.BASE + '">');
  // 404.html bounces deep links here as ?p=...; put the real path back.
  (function () {
    var q = new URLSearchParams(location.search), p = q.get('p');
    if (p !== null) { q.delete('p'); var s = q.toString();
      history.replaceState(null, '', window.BASE + p.replace(/^\/+/, '') + (s ? '?' + s : '') + location.hash); }
    try { var t = localStorage.getItem('cw.theme'); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site/style.css">
</head>
<body class="at-home">

    <nav id="labels" aria-label="Sections"></nav>
  </div>

  <header id="hud">
    <a class="mark" href="./" data-link>COLIN<b>WILLOW</b></a>
    <div class="tools">
      <button id="sound" class="tool" aria-label="Play music (the globe reacts to it)" title="Music">♪</button>
      <button id="theme" class="tool" aria-label="Toggle light and dark" title="Light / dark">◐</button>
      <button id="accent" class="tool swatch" aria-label="Change accent colour (hold for random)" title="Accent colour — tap to cycle, hold for random"></button>
    </div>
  </header>

  <div id="hero">
    <h1>Colin Willow</h1>
    <p id="tagline"></p>
    <a class="scroll-cue" href="#index">Walk the aisle ↓</a>

  <main id="view" tabindex="-1"></main>

  <noscript><p style="padding:2rem">This site needs JavaScript. The <a href="classic.html">previous portfolio</a> works without it.</p></noscript>
  <script type="module" src="site/app.js"></script>
</body>
</html>
